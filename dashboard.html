<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jangkung Order - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Schoolbell&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        body {
            font-family: 'Poppins', sans-serif;
        }

        .dashboard-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: white;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .bg-utama {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            background: url('bg.png') center center / cover no-repeat;
        }

        .overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: rgba(0, 0, 0, 0.35);
            pointer-events: none;
            z-index: 2;
        }

        .decorations {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .decorations img {
            position: absolute;
            opacity: 1;
        }

        .decorations .tomat-atas-kiri {
            width: clamp(60px, 15vw, 250px);
            left: 0%;
            top: 0%;
        }

        .decorations .tomat1-bawah-kanan {
            width: clamp(60px, 15vw, 250px);
            right: 0%;
            bottom: 0%;
        }

        .decorations .cabe2-atas-kanan {
            width: clamp(50px, 12vw, 200px);
            right: 0%;
            top: 0%;
        }

        .decorations .cabe21-atas-kanan {
            width: clamp(50px, 12vw, 200px);
            right: 0%;
            top: 0%;
        }

        .decorations .cabe1-bawah-kiri {
            width: clamp(50px, 12vw, 200px);
            left: 0%;
            bottom: 0%;
        }

        .decorations .cabe11-bawah-kiri {
            width: clamp(50px, 12vw, 200px);
            left: 0%;
            bottom: 0%;
        }

        .header-top {
            position: relative;
            z-index: 10;
            padding: 6px 12px;
            padding-top: env(safe-area-inset-top, 6px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
            flex-shrink: 0;
            min-height: 44px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-back {
            background: none;
            border: none;
            color: white;
            font-size: clamp(18px, 2.8%, 32px);
            cursor: pointer;
            transition: all 0.3s;
            padding: 4px 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            min-width: 40px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-back:active {
            transform: scale(0.92);
        }

        .logo-header {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .logo-header img {
            width: clamp(22px, 3.5%, 40px);
            height: auto;
            filter: drop-shadow(0 2px 10px rgba(0,0,0,0.3));
        }

        .brand-text {
            color: white;
            font-size: clamp(12px, 2%, 22px);
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        .brand-text span {
            color: #98C81C;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-logout {
            background: transparent;
            border-radius: 50px;
            border: 2px solid #e74c3c;
            padding: 4px 12px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            font-size: clamp(10px, 1.4%, 16px);
            font-family: 'Schoolbell', cursive;
            font-weight: 400;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            min-height: 32px;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-logout:active {
            background: rgba(231, 76, 60, 0.2);
            transform: scale(0.95);
        }

        .btn-to-index {
            background: transparent;
            border-radius: 50px;
            border: 2px solid white;
            padding: 4px 12px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            font-size: clamp(10px, 1.4%, 16px);
            font-family: 'Schoolbell', cursive;
            font-weight: 400;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            min-height: 32px;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-to-index:active {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(0.95);
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
            padding: 8px 12px 16px 12px;
            padding-bottom: env(safe-area-inset-bottom, 16px);
            min-height: 0;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            width: 100%;
            max-width: 700px;
            justify-content: center;
            flex-shrink: 0;
        }

        .header-content .logo-besar {
            width: clamp(50px, 14%, 140px);
            height: auto;
            flex-shrink: 0;
        }

        .header-content .logo-besar img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.2));
        }

        .header-content .title {
            color: white;
            font-size: clamp(18px, 4.5%, 48px);
            font-weight: 600;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            line-height: 1.1;
            letter-spacing: 2px;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 700px;
            flex-shrink: 0;
        }

        .menu-card {
            background: #98C81C;
            border-radius: 28px;
            border: 2px solid white;
            aspect-ratio: 1.4/1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(152, 200, 28, 0.2);
            text-align: center;
            padding: 8px 6px;
            min-height: 50px;
            -webkit-tap-highlight-color: transparent;
        }

        .menu-card:active {
            transform: scale(0.97);
        }

        .menu-card .card-label {
            color: white;
            font-size: clamp(11px, 2.5%, 28px);
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            letter-spacing: 0.5px;
            word-wrap: break-word;
            line-height: 1.2;
        }

            .decorations .tomat1-bawah-kanan {
                width: clamp(80px, 18vw, 220px);
            }

            .decorations .cabe21-atas-kanan,
            .decorations .cabe1-bawah-kiri,
            .decorations .cabe11-bawah-kiri {

            .content-area { padding: 8px 20px 15px 20px; }
            .header-content { margin-bottom: 10px; gap: 12px; max-width: 650px; }
            .header-content .logo-besar { width: clamp(55px, 14%, 130px); }
            .header-content .title { font-size: clamp(20px, 4.5%, 40px); }
            .menu-grid { gap: 10px; max-width: 650px; }
            .menu-card { border-radius: 26px; min-height: 55px; padding: 6px; }
            .menu-card .card-label { font-size: clamp(13px, 3%, 28px); }

            .decorations .tomat1-bawah-kanan {
                width: clamp(50px, 12vw, 160px);
            }
            .decorations .cabe2-atas-kanan,

<body>
    <div class="dashboard-container">
        <div class="bg-utama"></div>
        <div class="overlay"></div>

        <div class="decorations">
            <img class="tomat-atas-kiri" src="tomat2.png" alt="Tomat" loading="lazy" onerror="this.style.display='none'">
            <img class="cabe2-atas-kanan" src="cabe2.png" alt="Cabe" loading="lazy" onerror="this.style.display='none'">
            <img class="cabe21-atas-kanan" src="cabe2.1.png" alt="Cabe" loading="lazy" onerror="this.style.display='none'">
            <img class="cabe1-bawah-kiri" src="cabe1.png" alt="Cabe" loading="lazy" onerror="this.style.display='none'">
            <img class="cabe11-bawah-kiri" src="cabe1.1.png" alt="Cabe" loading="lazy" onerror="this.style.display='none'">
            <img class="tomat1-bawah-kanan" src="tomat1.png" alt="Tomat" loading="lazy" onerror="this.style.display='none'">
        </div>

        <!-- Header -->
        <div class="header-top">
            <div class="header-left">
                <button class="btn-back" onclick="goToIndex()">←</button>
                <div class="logo-header" onclick="goToIndex()">
                    <img src="logo.png" alt="Logo" loading="lazy" onerror="this.src='https://placehold.co/50x50/98C81C/ffffff?text=🍽️'" />
                    <div class="brand-text">Jangkung<span>Order</span></div>
                </div>
            </div>
            <div class="header-right">
                <button class="btn-to-index" onclick="goToIndex()">🏠 Index</button>
                <button class="btn-logout" onclick="logoutKaryawan()">🔓 Logout</button>
            </div>
        </div>

        <!-- Content -->
        <div class="content-area">
            <div class="header-content">
                <div class="logo-besar">
                    <img src="logo.png" alt="Logo" loading="lazy" onerror="this.style.display='none'" />
                </div>
                <div class="title">WILUJENG<br>SUMPING!</div>
            </div>

            <div class="menu-grid">
                <div class="menu-card" onclick="window.location.href='karyawan_status.html'">
                    <div class="card-label">STATUS PESANAN</div>
                </div>
                <div class="menu-card" onclick="window.location.href='karyawan_list_order.html'">
                    <div class="card-label">LIST PESANAN</div>
                </div>
                <div class="menu-card" onclick="window.location.href='karyawan_meja.html'">
                    <div class="card-label">MEJA</div>
                </div>
                <div class="menu-card" onclick="window.location.href='karyawan_struk.html'">
                    <div class="card-label">STRUK</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // AUTH CHECK - WAJIB ADA DI SEMUA HALAMAN KARYAWAN
        // ============================================
        const SESSION_KEY = 'karyawan_session';
        const LOGIN_PAGE = 'karyawan_login.html';

        function checkAuth() {
            const session = localStorage.getItem(SESSION_KEY);
            const sessionStart = sessionStorage.getItem('karyawan_session_start');
            
            if (!session || !sessionStart) {
                redirectToLogin();
                return false;
            }
            
            const elapsed = Date.now() - parseInt(sessionStart);
            if (elapsed > 30 * 60 * 1000) {
                clearAllSession();
                redirectToLogin();
                return false;
            }
            
            return true;
        }

        function clearAllSession() {
            localStorage.removeItem(SESSION_KEY);
            localStorage.removeItem('karyawan_logged_in');
            localStorage.removeItem('login_time');
            sessionStorage.removeItem('karyawan_session_start');
        }

        function redirectToLogin() {
            if (window.location.pathname.includes('karyawan_login.html')) return;
            window.location.href = LOGIN_PAGE;
        }

        // ============================================
        // FUNGSI KE INDEX - HAPUS SESSION & REDIRECT
        // ============================================
        function goToIndex() {
            if (confirm('Keluar dari halaman karyawan? Anda harus login lagi nanti.')) {
                clearAllSession();
                window.location.href = 'index.html';
            }
        }

        // ============================================
        // FUNGSI LOGOUT
        // ============================================
        function logoutKaryawan() {
            if (confirm('Yakin ingin keluar?')) {
                clearAllSession();
                window.location.href = LOGIN_PAGE;
            }
        }

        // ============================================
        // PROTECT BACK BUTTON
        // ============================================
        window.history.pushState(null, '', window.location.href);
        window.addEventListener('popstate', function() {
            if (!checkAuth()) {
                redirectToLogin();
            } else {
                window.history.pushState(null, '', window.location.href);
            }
        });

        // ============================================
        // CEK AUTH SAAT LOAD
        // ============================================
        if (!checkAuth()) {
            redirectToLogin();
        }

        // ============================================
        // CEK SAAT PAGE VISIBLE
        // ============================================
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') {
                if (!checkAuth()) {
                    redirectToLogin();
                }
            }
        });

        console.log('🔒 Auth aktif - Wajib login setiap kali masuk area karyawan');
    </script>
</body>
</html>
