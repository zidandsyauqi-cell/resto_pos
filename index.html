<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jangkung Order</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Schoolbell&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        body {
            font-family: 'Poppins', sans-serif;
        }

        .index-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: white;
            overflow: hidden;
        }

        .bg-utama {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            background: url('bg.png') center center / cover no-repeat;
        }

        .overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: rgba(0, 0, 0, 0.4);
            pointer-events: none;
            z-index: 1;
        }

        .decorations {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .decorations img {
            position: absolute;
            opacity: 1;
        }

        .decorations .tomat-atas-kiri {
            width: clamp(60px, 15vw, 250px);
            left: 0%;
            top: 0%;
        }

        .decorations .tomat1-bawah-kanan {
            width: clamp(60px, 15vw, 250px);
            right: 0%;
            bottom: 0%;
        }

        .decorations .cabe2-atas-kanan {
            width: clamp(50px, 12vw, 200px);
            right: 0%;
            top: 0%;
        }

        .decorations .cabe21-atas-kanan {
            width: clamp(50px, 12vw, 200px);
            right: 0%;
            top: 0%;
        }

        .decorations .cabe1-bawah-kiri {
            width: clamp(50px, 12vw, 200px);
            left: 0%;
            bottom: 0%;
        }

        .decorations .cabe11-bawah-kiri {
            width: clamp(50px, 12vw, 200px);
            left: 0%;
            bottom: 0%;
        }

        .content-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
            padding: 20px;
        }

        .logo-besar {
            width: clamp(120px, 25%, 250px);
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3));
        }

        .logo-besar img {
            width: 100%;
            height: auto;
            display: block;
        }

        .title-index {
            color: white;
            font-size: clamp(28px, 6%, 60px);
            font-weight: 700;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: 3px;
        }

        .title-index span {
            color: #98C81C;
        }

        .subtitle-index {
            color: rgba(255,255,255,0.6);
            font-size: clamp(12px, 2%, 22px);
            font-family: 'Schoolbell', cursive;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            text-align: center;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-index {
            padding: clamp(12px, 2.5%, 22px) clamp(30px, 6%, 60px);
            border-radius: 60px;
            border: 3px solid white;
            font-size: clamp(16px, 3%, 32px);
            font-family: 'Schoolbell', cursive;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 150px;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .btn-index:active {
            transform: scale(0.95);
        }

        .btn-customer {
            background: #98C81C;
            color: white;
        }

        .btn-customer:active {
            background: #7aa814;
        }

        .btn-karyawan {
            background: transparent;
            color: white;
        }

        .btn-karyawan:active {
            background: rgba(255,255,255,0.1);
        }

        /* ===== RESPONSIVE ===== */
        @media screen and (max-width: 480px) {
            .btn-group { gap: 10px; flex-direction: column; align-items: center; }
            .btn-index { min-width: 120px; padding: 10px 20px; font-size: 14px; border-width: 2px; }
            .logo-besar { width: 80px; margin-bottom: 12px; }
            .title-index { font-size: 22px; }
            .subtitle-index { font-size: 11px; margin-bottom: 16px; }
            .decorations .tomat-atas-kiri,
            .decorations .tomat1-bawah-kanan {
                width: clamp(40px, 15vw, 100px);
            }
            .decorations .cabe2-atas-kanan,
            .decorations .cabe21-atas-kanan,
            .decorations .cabe1-bawah-kiri,
            .decorations .cabe11-bawah-kiri {
                width: clamp(35px, 12vw, 80px);
            }
        }

        @media screen and (orientation: landscape) and (max-height: 500px) {
            .logo-besar { width: 60px; margin-bottom: 8px; }
            .title-index { font-size: 18px; }
            .subtitle-index { font-size: 10px; margin-bottom: 12px; }
            .btn-index { padding: 6px 16px; font-size: 12px; min-width: 100px; border-width: 2px; }
            .btn-group { gap: 8px; }
        }

        @media screen and (min-width: 768px) and (max-width: 1024px) and (orientation: portrait) {
            .logo-besar { width: 180px; }
            .title-index { font-size: 40px; }
        }

        @media screen and (min-width: 1025px) {
            .logo-besar { width: 220px; }
            .title-index { font-size: 50px; }
        }
    </style>
</head>
<body>
    <div class="index-container">
        <div class="bg-utama"></div>
        <div class="overlay"></div>

        <div class="decorations">
            <img class="tomat-atas-kiri" src="tomat2.png" alt="Tomat" loading="lazy" onerror="this.style.display='none'">
            <img class="cabe2-atas-kanan" src="cabe2.png" alt="Cabe" loading="lazy" onerror="this.style.display='none'">
            <img class="cabe21-atas-kanan" src="cabe2.1.png" alt="Cabe" loading="lazy" onerror="this.style.display='none'">
            <img class="cabe1-bawah-kiri" src="cabe1.png" alt="Cabe" loading="lazy" onerror="this.style.display='none'">
            <img class="cabe11-bawah-kiri" src="cabe1.1.png" alt="Cabe" loading="lazy" onerror="this.style.display='none'">
            <img class="tomat1-bawah-kanan" src="tomat1.png" alt="Tomat" loading="lazy" onerror="this.style.display='none'">
        </div>

        <div class="content-wrapper">
            <div class="logo-besar">
                <img src="logo.png" alt="Logo" loading="lazy" onerror="this.style.display='none'" />
            </div>

            <div class="title-index">Jangkung<span>Order</span></div>
            <div class="subtitle-index">Pesan Makanan & Minuman Jadi Lebih Mudah</div>

            <div class="btn-group">
                <button class="btn-index btn-customer" onclick="goToCustomer()">👨‍🍳 Customer</button>
                <button class="btn-index btn-karyawan" onclick="goToKaryawan()">🔒 Karyawan</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // KE CUSTOMER - LANGSUNG MASUK
        // ============================================
        function goToCustomer() {
            window.location.href = 'customer_login.html';
        }

        // ============================================
        // KE KARYAWAN - HAPUS SESSION DULU
        // ============================================
        function goToKaryawan() {
            // 🔥 Hapus semua session karyawan biar wajib login password
            localStorage.removeItem('karyawan_session');
            localStorage.removeItem('karyawan_logged_in');
            localStorage.removeItem('login_time');
            sessionStorage.removeItem('karyawan_session_start');
            
            // Ke halaman login
            window.location.href = 'karyawan_login.html';
        }

        console.log('🏠 Index - Pilih Customer atau Karyawan');
    </script>
</body>
</html>
